<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BSocial</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b10;color:#fff;font-family:Inter,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1200px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:#0b0b10ee;border-bottom:1px solid #252532;padding:12px 18px;display:flex;align-items:center;gap:14px}.logo{font-size:28px;font-weight:900;background:linear-gradient(135deg,#fff,#8b5cf6);-webkit-background-clip:text;color:transparent}.search{flex:1;background:#171720;border:1px solid #29293a;border-radius:14px;padding:11px 14px;color:#fff}.nav{display:flex;gap:7px;overflow:auto;padding:10px 14px;border-bottom:1px solid #22222d}.nav button,.pill{background:#171720;color:#ddd;border:1px solid #29293a;border-radius:12px;padding:9px 13px;white-space:nowrap}.nav button.active{background:#fff;color:#111}.main{padding:18px}.card{background:#12121a;border:1px solid #262633;border-radius:18px;padding:16px;margin-bottom:14px}.composer textarea{width:100%;min-height:80px;background:#0d0d14;color:#fff;border:1px solid #2c2c3a;border-radius:12px;padding:12px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.primary{background:#fff;color:#111;border-radius:12px;padding:10px 15px;font-weight:700}.ghost{background:#1b1b25;color:#eee;border-radius:12px;padding:10px 15px}.muted{color:#999}.posthead{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#ec4899);display:grid;place-items:center;font-weight:800}.postimg,.postvideo{width:100%;max-height:600px;object-fit:cover;border-radius:14px;margin-top:12px}.stats{display:flex;gap:18px;color:#aaa;font-size:14px}.actions{display:flex;gap:7px;margin-top:10px}.actions button{background:#1b1b25;color:#ddd;border-radius:10px;padding:8px 11px}.profile{display:grid;grid-template-columns:100px 1fr;gap:18px;align-items:center}.bigavatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#ec4899);display:grid;place-items:center;font-size:34px;font-weight:900}.verified{color:#60a5fa}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button{background:#191922;color:#ccc;padding:9px 12px;border-radius:10px}.tabs button.active{background:#fff;color:#111}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{max-width:430px;width:100%;background:#12121a;border:1px solid #29293a;border-radius:24px;padding:26px}.loginbox input{width:100%;margin:7px 0;background:#0c0c12;border:1px solid #2b2b39;border-radius:12px;padding:12px;color:#fff}.admin{border:1px solid #4f46e5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.social{display:inline-flex;gap:6px;align-items:center;background:#191922;padding:8px 10px;border-radius:10px;color:#fff;text-decoration:none}@media(max-width:700px){.top{flex-wrap:wrap}.search{order:3;flex-basis:100%}.profile{grid-template-columns:70px 1fr}.bigavatar{width:70px;height:70px;font-size:25px}}
</style></head>
<body><div id="root"></div>
<script>
const KEY='bsocial_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{users:[],posts:[],stories:[],messages:[],firstOwnerId:null,current:null};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function user(){return db.users.find(u=>u.id===db.current)}
function go(page){render(page)}
function avatar(u,cls='avatar'){return '<div class="'+cls+'">'+esc((u?.username||'B')[0].toUpperCase())+'</div>'}
function login(){document.getElementById('root').innerHTML='<div class="login"><div class="loginbox"><div class="logo">BS</div><h1>BSocial</h1><p class="muted">Entre ou crie sua conta.</p><input id="name" placeholder="Usuário"><input id="email" placeholder="Gmail"><input id="phone" placeholder="Telefone"><button class="primary" style="width:100%;margin-top:8px" onclick="create()">Criar conta</button><button class="ghost" style="width:100%;margin-top:8px" onclick="google()">Continuar com Google</button><p class="muted" style="font-size:12px;margin-top:16px">A autenticação Google/telefone real precisa de um provedor OAuth/SMS no backend.</p></div></div>'}
function create(){let n=document.getElementById('name').value.trim(),e=document.getElementById('email').value.trim(),p=document.getElementById('phone').value.trim();if(!n)return alert('Digite seu usuário.');let u={id:crypto.randomUUID(),username:n,email:e,phone:p,bio:'',verified:false,followers:0,following:0,social:{instagram:'',tiktok:'',youtube:''},owner:false};if(!db.firstOwnerId){u.owner=true;db.firstOwnerId=u.id}db.users.push(u);db.current=u.id;save();followOwnerPrompt();render('home')}
function google(){alert('Configure OAuth do Google no backend para ativar login real.');}
function followOwnerPrompt(){let m=document.createElement('div');m.style='position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:99';m.innerHTML='<div class="card" style="max-width:380px;margin:20px"><h2>Seguir dono do site</h2><p>Siga o perfil do dono do BSocial no Instagram.</p><button class="primary" onclick="location.href=\'https://www.instagram.com/bjonas_31?stkn=MW9lZXVianV1bTE1ZQ==\'">Seguir dono do site</button><button class="ghost" style="margin-left:6px" onclick="this.parentElement.parentElement.remove()">Continuar</button></div>';document.body.appendChild(m)}
function shell(page,body){let u=user();document.getElementById('root').innerHTML='<div class="app"><header class="top"><div class="logo">BS</div><input class="search" placeholder="Procurar pessoas e músicas..." onkeydown="if(event.key===\'Enter\')alert(\'Busca: \'+this.value)"><button class="ghost" onclick="go(\'messages\')">💬</button><button class="ghost" onclick="go(\'notifications\')">🔔</button></header><nav class="nav">'+['home','foryou','create','freefire','favorites','profile'].map(x=>'<button class="'+(page===x?'active':'')+'" onclick="go(\''+x+'\')">'+({home:'Início',foryou:'For You',create:'Publicar',freefire:'FREEFIRE',favorites:'Favoritos',profile:'Perfil'}[x])+'</button>').join('')+(u?.owner?'<button class="'+(page==='admin'?'active':'')+'" onclick="go(\'admin\')">👑 Admin</button>':'')+'</nav><main class="main">'+body+'</main></div>'}
function render(page='home'){if(!db.current||!user())return login();if(page==='create')return createPage();if(page==='freefire')return ff('HUD');if(page==='favorites')return shell(page,'<h2>Favoritos</h2>'+db.posts.filter(p=>p.likedBy?.includes(db.current)).map(post).join('')||'<p class="muted">Nenhum favorito.</p>');if(page==='profile')return profile(user());if(page==='messages')return messages();if(page==='notifications')return shell(page,'<h2>Notificações</h2><div class="card">Tudo tranquilo por aqui.</div>');if(page==='admin')return admin();let arr=page==='foryou'?[...db.posts].reverse():[...db.posts].reverse();return shell(page,'<h2>'+ (page==='foryou'?'For You':'Início')+'</h2><div class="card composer"><textarea id="quick" placeholder="No que você está pensando?"></textarea><button class="primary" onclick="quickPost()">Publicar</button></div>'+arr.map(post).join('')||'<div class="card">Ainda não há publicações.</div>')}
function quickPost(){let t=document.getElementById('quick').value.trim();if(!t)return;db.posts.push({id:crypto.randomUUID(),userId:db.current,text:t,type:'text',likes:0,comments:0,reposts:0,likedBy:[],created:Date.now()});save();render('home')}
function post(p){let u=db.users.find(x=>x.id===p.userId)||{};return '<article class="card"><div class="posthead">'+avatar(u)+'<div><b>'+esc(u.username)+'</b> '+(u.verified?'<span class="verified">✓</span>':'')+'<div class="muted">@'+esc(u.username)+'</div></div></div><p>'+esc(p.text||'')+'</p>'+(p.media?(p.type==='video'?'<video class="postvideo" src="'+esc(p.media)+'" controls autoplay muted loop></video>':'<img class="postimg" src="'+esc(p.media)+'">'):'')+'<div class="stats"><span>❤️ '+(p.likes||0)+'</span><span>💬 '+(p.comments||0)+'</span><span>🔁 '+(p.reposts||0)+'</span></div><div class="actions"><button onclick="like(\''+p.id+'\')">❤️ Curtir</button><button onclick="repost(\''+p.id+'\')">🔁 Republicar</button><button onclick="copyText(\''+encodeURIComponent(p.text||'')+'\')">📋 Copiar</button><button onclick="alert(\'Marcação: digite @usuário na legenda para mencionar.\')">@ Marcar</button></div></article>'}
function like(id){let p=db.posts.find(x=>x.id===id);p.likedBy=p.likedBy||[];let i=p.likedBy.indexOf(db.current);if(i<0){p.likedBy.push(db.current);p.likes=(p.likes||0)+1}else{p.likedBy.splice(i,1);p.likes--}save();render('home')}
function repost(id){let p=db.posts.find(x=>x.id===id);db.posts.push({...p,id:crypto.randomUUID(),userId:db.current,reposts:0,created:Date.now()});save();render('home')}
function copyText(s){navigator.clipboard?.writeText(decodeURIComponent(s));alert('Texto copiado.')}
function createPage(){shell('create','<h2>Criar publicação</h2><div class="card"><textarea id="ct" placeholder="Legenda"></textarea><input id="media" class="search" style="margin-top:8px" placeholder="URL da imagem/vídeo (opcional)"><select id="typ" class="search" style="margin-top:8px"><option value="text">Texto</option><option value="image">Imagem</option><option value="video">Vídeo</option></select><input id="mentions" class="search" style="margin-top:8px" placeholder="Marcar usuários: @nome @nome2"><button class="primary" style="margin-top:8px" onclick="publish()">Publicar</button></div>')}
function publish(){let t=document.getElementById('ct').value,m=document.getElementById('media').value,ty=document.getElementById('typ').value;db.posts.push({id:crypto.randomUUID(),userId:db.current,text:t,media:m,type:ty,likes:0,comments:0,reposts:0,likedBy:[],created:Date.now()});save();go('home')}
function ff(tab){let tabs=['HUD','SENSIBILIDADE','MECANICAS','MACETES'];let content=tab==='HUD'?'<div class="card"><b>HUD</b><p class="muted">Publicações: imagem + legenda com texto copiável.</p></div>':tab==='SENSIBILIDADE'?'<div class="card"><b>SENSIBILIDADE</b><p class="muted">Publicações somente de imagem.</p></div>':'<div class="card"><b>'+tab+'</b><p class="muted">Publicações de vídeo.</p></div>';return shell('freefire','<h2>🎮 FREEFIRE</h2><div class="tabs">'+tabs.map(t=>'<button onclick="ff(\''+t+'\')">'+t+'</button>').join('')+'</div>'+content+'<div class="card"><textarea id="fft" placeholder="Legenda/texto"></textarea><input id="ffm" class="search" placeholder="URL da mídia"><button class="primary" style="margin-top:8px" onclick="ffpublish(\''+tab+'\')">Publicar em '+tab+'</button></div>'+db.posts.filter(p=>p.category===tab).reverse().map(post).join(''))}
function ffpublish(cat){let t=document.getElementById('fft').value,m=document.getElementById('ffm').value;let type=cat==='HUD'||cat==='SENSIBILIDADE'?'image':'video';if(!m)return alert('Adicione a URL da mídia.');db.posts.push({id:crypto.randomUUID(),userId:db.current,text:cat==='SENSIBILIDADE'?'':t,media:m,type,category:cat,likes:0,comments:0,reposts:0,likedBy:[],created:Date.now()});save();ff(cat)}
function profile(u){let posts=db.posts.filter(p=>p.userId===u.id).reverse();return shell('profile','<div class="card profile">'+avatar(u,'bigavatar')+'<div><h2>'+esc(u.username)+' '+(u.verified?'<span class="verified">✓</span>':'')+'</h2><p>'+esc(u.bio||'')+'</p><div class="stats"><span>👥 '+u.followers+' seguidores</span><span>➡️ '+u.following+' seguindo</span><span>📝 '+posts.length+' publicações</span></div><div class="row" style="margin-top:8px">'+Object.entries(u.social||{}).filter(([k,v])=>v).map(([k,v])=>'<a class="social" target="_blank" href="'+esc(v)+'">'+({instagram:'◎',tiktok:'♪',youtube:'▶'}[k]||'↗')+' '+k+'</a>').join('')+'</div></div></div><div class="card"><button class="primary" onclick="editProfile()">Editar perfil</button></div><h3>Publicações</h3>'+posts.map(post).join(''))}
function editProfile(){let u=user(),b=prompt('Bio',u.bio);if(b!==null)u.bio=b;for(let k of ['instagram','tiktok','youtube']){let v=prompt('Link '+k,u.social[k]||'');if(v!==null)u.social[k]=v}save();profile(u)}
function messages(){return shell('messages','<h2>Mensagens</h2><div class="card"><p>Áudio e texto entre usuários.</p><input id="to" class="search" placeholder="@usuário destinatário"><textarea id="msg" style="width:100%;margin-top:8px;background:#0d0d14;color:#fff;padding:12px;border-radius:12px" placeholder="Mensagem"></textarea><div class="row" style="margin-top:8px"><button class="primary" onclick="sendMsg()">Enviar</button><button class="ghost" onclick="alert(\'No navegador, use o botão de gravação do dispositivo; para áudio persistente, conecte storage/backend.\')">🎙️ Áudio</button></div></div><div class="card">'+db.messages.map(m=>'<p><b>'+esc(m.from)+'</b> → <b>'+esc(m.to)+'</b>: '+esc(m.text)+'</p>').join('')+'</div>')}
function sendMsg(){let to=document.getElementById('to').value.replace('@','').trim(),text=document.getElementById('msg').value.trim();if(!to||!text)return;db.messages.push({from:user().username,to,text});save();messages()}
function admin(){if(!user().owner)return go('home');return shell('admin','<h2>👑 Painel do dono</h2><div class="grid"><div class="card"><b>'+db.users.length+'</b><div class="muted">Contas</div></div><div class="card"><b>'+db.posts.length+'</b><div class="muted">Publicações</div></div><div class="card"><b>'+db.stories.length+'</b><div class="muted">Stories</div></div></div><div class="card"><h3>Verificar usuários</h3>'+db.users.map(u=>'<div class="row" style="justify-content:space-between;padding:8px 0"><span>'+esc(u.username)+'</span><button class="ghost" onclick="verify(\''+u.id+'\')">'+(u.verified?'Remover verificado':'Dar verificado')+'</button></div>').join('')+'</div><div class="card"><b>Primeira conta</b><p class="muted">O primeiro cadastro foi definido automaticamente como dono.</p></div>')}
function verify(id){let u=db.users.find(x=>x.id===id);u.verified=!u.verified;save();admin()}
if(db.current)render('home');else login();
</script></body></html>
